<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Video Çetele</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--ink:#111;--muted:#777;--line:#e9e9eb;--accent:#111}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}.app{max-width:760px;margin:auto;padding:18px 15px 90px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.header h1{margin:0;font-size:29px}.header p{margin:4px 0 0;color:var(--muted);font-size:13px}
.iconbtn{width:42px;height:42px;border:0;border-radius:14px;background:#fff;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{background:#111;color:#fff;border-radius:19px;padding:17px}.stat b{font-size:30px;display:block}.stat span{font-size:11px;color:#aaa}
.section-title{font-size:18px;font-weight:800;margin:20px 2px 10px}
.pages{display:grid;gap:11px}.page{background:#fff;border:0;border-radius:20px;padding:17px;text-align:left;box-shadow:0 2px 12px #0000000b;display:flex;align-items:center;justify-content:space-between}.page:active{transform:scale(.99)}
.page-name{font-size:18px;font-weight:800}.page-meta{font-size:12px;color:#777;margin-top:4px}.arrow{font-size:25px;color:#999}
.back{border:0;background:#fff;border-radius:12px;padding:9px 12px;margin-bottom:12px;font-weight:700}
.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.account{background:#fff;border-radius:18px;padding:15px;box-shadow:0 2px 12px #0000000b}.account h3{margin:0;font-size:18px}.account .meta{color:#777;font-size:12px;margin:4px 0 12px}.add{width:100%;border:0;background:#111;color:#fff;border-radius:11px;padding:11px;font-weight:800}
.summary{background:#fff;border-radius:20px;padding:15px;margin-bottom:13px}.summary-row{display:flex;justify-content:space-between}.summary b{font-size:23px}
.records{background:#fff;border-radius:20px;padding:4px 15px}.record{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.record:last-child{border-bottom:0}.record-main{min-width:0}.record-title{font-weight:800}.record-time{color:#777;font-size:12px;margin-top:3px}.url{display:inline-block;margin-top:7px;color:#111;font-size:12px;text-decoration:none;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.delete{border:0;background:#eee;color:#333;border-radius:9px;padding:7px 9px;height:34px}.empty{text-align:center;color:#999;padding:20px 5px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ddd;padding:9px 15px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center}.bottom button{border:0;background:#111;color:#fff;border-radius:12px;padding:10px 18px;font-weight:800}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;z-index:10}.sheet{width:min(760px,100%);margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 5px;font-size:21px}.sheet p{margin:0 0 15px;color:#777;font-size:13px}.sheet input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;outline:0}.primary{width:100%;border:0;background:#111;color:#fff;border-radius:12px;padding:14px;margin-top:10px;font-weight:800}.cancel{width:100%;border:0;background:#eee;color:#111;border-radius:12px;padding:12px;margin-top:8px;font-weight:700}
.pageview{display:none}.pageview.active{display:block}
@media(min-width:650px){.pages{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">

<section id="home" class="pageview active">
  <div class="header"><div><h1>Video Çetele</h1><p id="todayText"></p></div><button class="iconbtn" onclick="resetToday()">↻</button></div>
  <div class="stats"><div class="stat"><b id="homeToday">0</b><span>BUGÜN TOPLAM</span></div><div class="stat"><b id="homePlanned">0</b><span>PLANLANAN</span></div><div class="stat"><b id="homeAll">0</b><span>TÜM KAYITLAR</span></div></div>
  <div class="section-title">Sayfalar</div>
  <div class="pages" id="pageCards"></div>
</section>

<section id="detail" class="pageview">
  <button class="back" onclick="goHome()">‹ Sayfalar</button>
  <div class="header"><div><h1 id="detailName"></h1><p id="detailDate"></p></div></div>
  <div class="summary"><div class="summary-row"><span>Bugün</span><b id="detailToday">0</b></div><div class="summary-row" style="margin-top:8px"><span>Planlanan</span><b id="detailPlanned">0</b></div></div>
  <div class="section-title">Hesaplar</div>
  <div class="account-grid" id="accounts"></div>
  <div class="section-title">Bugünkü kayıtlar</div>
  <div class="records" id="records"></div><div class="section-title">Planlanan videolar</div><div class="records" id="plannedRecords"></div>
</section>

</div>

<div class="bottom"><button onclick="goHome()">Ana Sayfa</button></div>

<div class="modal" id="modal">
  <div class="sheet">
    <h2 id="modalTitle"></h2>
    <p id="modalInfo">Şimdi paylaştıysan tarih ve saat otomatik alınır.</p><div style="display:flex;gap:8px;margin-bottom:10px"><button class="primary" style="margin:0" onclick="setMode(false)">Şimdi Paylaştım</button><button class="cancel" style="margin:0" onclick="setMode(true)">Planladım</button></div><input id="planInput" type="datetime-local" style="display:none;margin-bottom:8px">
    <input id="linkInput" type="url" placeholder="Video linki (isteğe bağlı)">
    <button class="primary" onclick="saveRecord()">Videoyu Kaydet</button>
    <button class="cancel" onclick="closeModal()">Vazgeç</button>
  </div>
</div>

<script>
const pages=["Dizimasali","Videomasali","Dizikarmatv"];
const accounts=["Prive","Dinamo","Evetabi","Ngs","Redwin","Kulis"];
const KEY="video_cetele_3sayfa_v1";
let db=JSON.parse(localStorage.getItem(KEY)||"{}");
pages.forEach(p=>{if(!db[p]||typeof db[p]!=="object")db[p]={};accounts.forEach(a=>{if(!Array.isArray(db[p][a]))db[p][a]=[]})});
let currentPage="",currentAccount="",planning=false;

const $=id=>document.getElementById(id);
const isToday=ts=>new Date(ts).toDateString()===new Date().toDateString();
const dateFmt=ts=>new Intl.DateTimeFormat("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date(ts));
const timeFmt=ts=>new Intl.DateTimeFormat("tr-TR",{hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date(ts));
const persist=()=>localStorage.setItem(KEY,JSON.stringify(db));

function pageTotal(p,todayOnly=false){
 let n=0;accounts.forEach(a=>db[p][a].forEach(r=>{if(!r.plannedTs&&(!todayOnly||isToday(r.ts)))n++}));return n;
}
function allTotal(){return pages.reduce((s,p)=>s+pageTotal(p),0)}
function todayTotal(){return pages.reduce((s,p)=>s+pageTotal(p,true),0)} function plannedTotal(p){let n=0;accounts.forEach(a=>db[p][a].forEach(r=>{if(r.plannedTs)n++}));return n} function plannedOverall(){return pages.reduce((s,p)=>s+plannedTotal(p),0)}

function renderHome(){
 $("todayText").textContent=new Intl.DateTimeFormat("tr-TR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}).format(new Date());
 $("homeToday").textContent=todayTotal();$("homePlanned").textContent=plannedOverall();$("homeAll").textContent=allTotal();
 $("pageCards").innerHTML=pages.map(p=>`
 <button class="page" onclick="openPage('${p}')">
   <div><div class="page-name">${p}</div><div class="page-meta">${pageTotal(p,true)} video bugün · ${plannedTotal(p)} planlı · ${pageTotal(p)} toplam</div></div>
   <div class="arrow">›</div>
 </button>`).join("");
}
function openPage(p){
 currentPage=p;
 $("home").classList.remove("active");$("detail").classList.add("active");
 $("detailName").textContent=p;$("detailDate").textContent=new Intl.DateTimeFormat("tr-TR",{weekday:"long",day:"2-digit",month:"long"}).format(new Date());
 renderDetail();
 window.scrollTo(0,0);
}
function goHome(){
 currentPage="";$("detail").classList.remove("active");$("home").classList.add("active");renderHome();window.scrollTo(0,0);
}
function renderDetail(){
 $("detailToday").textContent=pageTotal(currentPage,true);$("detailPlanned").textContent=plannedTotal(currentPage);
 $("accounts").innerHTML=accounts.map(a=>`
 <div class="account">
  <h3>${a}</h3><div class="meta">${db[currentPage][a].filter(r=>isToday(r.ts)).length} video bugün</div>
  <button class="add" onclick="openModal('${a}')">+ Video Paylaştım</button>
 </div>`).join("");
 let rows=[];
 accounts.forEach(a=>db[currentPage][a].forEach((r,i)=>{if(!r.plannedTs&&isToday(r.ts))rows.push({a,i,...r})}));
 rows.sort((x,y)=>y.ts-x.ts);
 $("records").innerHTML=rows.length?rows.map(r=>`
 <div class="record">
  <div class="record-main">
   <div class="record-title">${r.a}</div>
   <div class="record-time">${dateFmt(r.ts)} · ${timeFmt(r.ts)}</div>
   ${r.url?`<a class="url" href="${escapeAttr(r.url)}" target="_blank" rel="noopener">🔗 ${escapeHtml(r.url)}</a>`:""}
  </div>
  <button class="delete" onclick="removeRecord('${r.a}',${r.i})">Sil</button>
 </div>`).join(""):'<div class="empty">Bugün henüz kayıt yok.</div>';
 let planned=[];accounts.forEach(a=>db[currentPage][a].forEach((r,i)=>{if(r.plannedTs)planned.push({a,i,...r})}));planned.sort((x,y)=>x.plannedTs-y.plannedTs);
 $("plannedRecords").innerHTML=planned.length?planned.map(r=>`
 <div class="record">
  <div class="record-main">
   <div class="record-title">📅 ${r.a}</div>
   <div class="record-time">Planlanan: ${dateFmt(r.plannedTs)} · ${timeFmt(r.plannedTs)}</div>
   ${r.url?`<a class="url" href="${escapeAttr(r.url)}" target="_blank" rel="noopener">🔗 ${escapeHtml(r.url)}</a>`:""}
  </div>
  <button class="delete" onclick="removeRecord('${r.a}',${r.i})">Sil</button>
 </div>`).join(""):'<div class="empty">Planlanmış video yok.</div>';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escapeAttr(s){return escapeHtml(s)}
function openModal(a){ currentAccount=a;planning=false;$("modalTitle").textContent=currentPage+" · "+a; $("linkInput").value="";$("planInput").value="";$("modal").style.display="flex";setMode(false);
 setTimeout(()=>$("linkInput").focus(),80);
}
function closeModal(){$("modal").style.display="none"} function setMode(plan){planning=plan;$("planInput").style.display=plan?"block":"none";$("modalInfo").textContent=plan?"Video daha sonra paylaşılacaksa tarih ve saati seç.":"Şimdi paylaştıysan tarih ve saat otomatik alınır."} function saveRecord(){ const url=$("linkInput").value.trim(); if(planning){const v=$("planInput").value;if(!v){alert("Planlanan tarih ve saati seç.");return}db[currentPage][currentAccount].push({ts:Date.now(),plannedTs:new Date(v).getTime(),url});}else db[currentPage][currentAccount].push({ts:Date.now(),url});
 persist();closeModal();renderDetail();renderHome();
}
function removeRecord(a,i){
 if(confirm("Bu video kaydını silmek istiyor musun?")){db[currentPage][a].splice(i,1);persist();renderDetail();renderHome()}
}
function resetToday(){
 if(confirm("Bugünkü tüm kayıtları silmek istiyor musun?")){
  pages.forEach(p=>accounts.forEach(a=>db[p][a]=db[p][a].filter(r=>!isToday(r.ts))));
  persist();renderHome();if(currentPage)renderDetail();
 }
}
renderHome();
</script>
</body>
</html>
